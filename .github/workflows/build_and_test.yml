name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: default_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      matrix:
        node-version: [22.x]
        service: [GestionSorteos, ManejoUsuarios]

    # ⬇️ AGREGAR ESTAS VARIABLES DE ENTORNO
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./${{ matrix.service }}/package-lock.json

    - name: Install Dependencies
      run: npm ci
      working-directory: ./${{ matrix.service }}

    - name: Wait for MySQL to be ready
      run: sleep 10

    - name: Run Sequelize Drop Database
      run: npx sequelize-cli db:drop --env test || true
      working-directory: ./${{ matrix.service }}

    - name: Run Sequelize Create Database
      run: npx sequelize-cli db:create --env test
      working-directory: ./${{ matrix.service }}

    - name: Run Sequelize Migrations
      run: npx sequelize-cli db:migrate --env test
      working-directory: ./${{ matrix.service }}

    - name: Run Tests
      run: npm test
      working-directory: ./${{ matrix.service }}
      timeout-minutes: 10